[package]
name = "vision-scope-desktop"
version = "0.1.0"
description = "VisionScope Desktop — universal file viewer"
authors = ["official@blendviewer.com"]
edition = "2021"

[lib]
name = "vision_scope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
