<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionScope</title>
    <!-- 关键首屏样式内联：在外部 CSS 加载前消除 FOUC，
         避免「打开文件」卡片先出现在左上角再跳回中间。 -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f7f8fa;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .viewer {
        display: none;
        width: 100%;
        height: 100%;
      }
      .drop-hint {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
      .drop-hint__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 48px 56px;
        background: #ffffff;
        border: 1.5px dashed #d0d5dd;
        border-radius: 16px;
        cursor: pointer;
        color: #667085;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewer" class="viewer"></div>
      <div id="drop-hint" class="drop-hint">
        <button id="open-btn" class="drop-hint__card" type="button">
          <span class="drop-hint__plus" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </span>
          <span class="drop-hint__title">打开文件</span>
          <span class="drop-hint__desc">点击选择文件，或将文件拖拽到此处</span>
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
