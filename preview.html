<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionScope Space Preview</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 24px 70px rgba(0, 0, 0, 0.35);
      }
      #viewer {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 12px;
      }
      #status {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        color: #64748b;
        font: 14px/1.5 system-ui, sans-serif;
        pointer-events: none;
        border-radius: 12px;
      }
      #status:empty {
        display: none;
      }
      #status .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: preview-spin 0.8s linear infinite;
      }
      @keyframes preview-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #close-button {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 10;
        width: 28px;
        height: 28px;
        display: none;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        color: #475569;
        font: 16px/1 system-ui, sans-serif;
        cursor: pointer;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 2px 8px rgba(0, 0, 0, 0.18);
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      #close-button:hover {
        background: #ef4444;
        color: #ffffff;
      }
      #close-button:active {
        transform: scale(0.94);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <button id="close-button" type="button" title="关闭预览" aria-label="关闭预览">×</button>
      <div id="status"><div class="spinner"></div><span>Loading…</span></div>
      <div id="viewer"></div>
    </div>
    <script type="module" src="/src-preview/main.js"></script>
  </body>
</html>
